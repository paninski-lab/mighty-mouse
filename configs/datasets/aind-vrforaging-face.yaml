# Dataset config for _raw/aind-vrforaging-face/ (see scripts/preprocess/aind-vrforaging-face/README.md).
# Three-quarter view of the right side of a head-fixed mouse's face; the labels are (corrected)
# pseudo-labels from the corpus model. Raw names are already canonical, so every keypoint is mapped
# one-to-one rather than with a {side} template. Every session is the animal's right side.

