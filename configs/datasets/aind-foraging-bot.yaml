# Dataset config for _raw/aind-foraging-bot/ (see scripts/preprocess/aind-foraging-bot/README.md).
# Bottom-up view of a head-fixed mouse at a lick spout; both sides are visible in every frame.
# Raw names are already canonical-style, with the left/right already swapped to the animal's side
# at conversion time (bottom-up camera), so every keypoint is mapped one-to-one rather than with a
# {side} template. Sessions are listed with a null side (config validation requires every session
# to appear).

exclude:
  keypoints:
  sessions:

keypoints:
  nose_tip: nose_tip
  tongue_tip: tongue_tip
  tongue_end_right: tongue_end_right
  tongue_end_left: tongue_end_left
  lowerlip: lowerlip
  paw_wrist_left: wrist_left
  paw_wrist_right: wrist_right
  nose_bottom: nose_bottom

sessions:
  bottom_face_1-0000: null
  bottom_face_5-0000: null
