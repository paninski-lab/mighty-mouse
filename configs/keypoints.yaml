# Canonical keypoint vocabulary shared across all datasets.
# Each dataset's config (configs/datasets/<name>.yaml) maps its native keypoint names to these.
# Bilateral keypoints use _left / _right suffixes.

keypoints:

  # ── eye ───────────────────────────────────────────────────────────────────
  - eye_back_left
  - eye_back_right
  - eye_bottom_left
  - eye_bottom_right
  - eye_front_left
  - eye_front_right
  - eye_top_left
  - eye_top_right
  - pupil_center_left
  - pupil_center_right
  # - pupil_back_left
  # - pupil_back_right
  # - pupil_bottom_left
  # - pupil_bottom_right
  # - pupil_front_left
  # - pupil_front_right
  # - pupil_top_left
  # - pupil_top_right

  # ── nose / mouth (lateralized) ────────────────────────────────────────────
  - upperlip_right
  - upperlip_left
  - tongue_end_right
  - tongue_end_left

  # ── nose / mouth (midline) ────────────────────────────────────────────────
  - nose_tip
  - nose_top
  - nose_bottom
  - mouth
  - lowerlip
  - tongue_tip

  # ── whiskers ──────────────────────────────────────────────────────────────
  - pad_top_left
  - pad_top_right
  - pad_side_left
  - pad_side_right

  # ── ears ──────────────────────────────────────────────────────────────────
  - ear_top_left
  - ear_top_right
  - ear_tip_left
  - ear_tip_right
  - ear_bottom_left
  - ear_bottom_right
  - ear_base_left
  - ear_base_right

  # ── paw ───────────────────────────────────────────────────────────────────
  - wrist_left
  - wrist_right
  - d1_tip_left
  - d1_tip_right
  - d2_tip_left
  - d2_tip_right
  - d3_tip_left
  - d3_tip_right
  - d4_tip_left
  - d4_tip_right
